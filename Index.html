
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b12">
<title>Smile AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b12;color:#f5f5fb;
font-family:system-ui,Arial,sans-serif}
.app{max-width:850px;margin:auto;height:100dvh;
display:flex;flex-direction:column;padding:16px}
header{display:flex;align-items:center;gap:12px;
padding:8px 0 18px;border-bottom:1px solid #292936}
.logo{width:44px;height:44px;border-radius:15px;
display:grid;place-items:center;font-size:25px;
background:linear-gradient(135deg,#855cff,#28c6d8)}
h1{font-size:20px;margin:0}
.sub{color:#9a9aaf;font-size:12px}
#chat{flex:1;overflow-y:auto;padding:18px 0}
.msg{padding:13px 15px;border-radius:17px;
margin:10px 0;max-width:90%;white-space:pre-wrap;
overflow-wrap:anywhere;line-height:1.6}
.ai{background:#191923;border:1px solid #2c2c3a}
.user{background:#5140bd;margin-left:auto}
.welcome{text-align:center;padding:40px 10px}
.welcome h2{font-size:29px;margin-bottom:8px}
.welcome p{color:#aaaabe}
.suggestions{display:flex;gap:8px;flex-wrap:wrap;
justify-content:center;margin-top:20px}
.suggestions button{background:#191923;color:#eee;
border:1px solid #343443;border-radius:20px;padding:10px}
form{display:flex;gap:8px;padding-top:12px;
border-top:1px solid #292936}
textarea{flex:1;resize:none;max-height:130px;
min-width:0;background:#191923;color:white;
border:1px solid #383848;border-radius:16px;
padding:14px;font:inherit;outline:none}
#send{background:#7956f6;color:white;border:0;
border-radius:14px;padding:0 18px;font-size:20px}
button{cursor:pointer}
button:disabled{opacity:.5}
footer{text-align:center;color:#77778c;font-size:11px;
padding-top:10px}
@media(min-width:600px){.app{padding:22px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">✦</div>
  <div><h1>Smile AI</h1>
  <div class="sub">AI assistant • siap membantu</div></div>
  <button id="clear" style="margin-left:auto;background:none;
  color:#aaa;border:0;padding:8px">Hapus chat</button>
</header>

<main id="chat" aria-live="polite">
  <div class="welcome" id="welcome">
    <h2>Halo! 👋</h2>
    <p>Aku Smile AI. Mau bikin sesuatu hari ini?</p>
    <div class="suggestions">
      <button data-p="Ajari aku JavaScript dari dasar">Belajar coding</button>
      <button data-p="Buatkan ide game Roblox yang unik">Ide game</button>
      <button data-p="Buatkan konsep website keren">Bikin website</button>
    </div>
  </div>
</main>

<form id="form">
  <textarea id="input" rows="1" maxlength="4000"
  placeholder="Tanya apa saja..." required></textarea>
  <button id="send" aria-label="Kirim">➤</button>
</form>
<footer>Jawaban AI bisa keliru. Periksa informasi penting.</footer>
</div>
<script>
const chat=document.querySelector("#chat");
const form=document.querySelector("#form");
const input=document.querySelector("#input");
const send=document.querySelector("#send");
const welcome=document.querySelector("#welcome");
let history=[];

try {
  const saved=JSON.parse(localStorage.getItem("smile-history")||"[]");
  if(Array.isArray(saved)){
    history=saved.filter(m=>m&&
      ["user","model"].includes(m.role)&&
      typeof m.text==="string").slice(-30);
  }
} catch {}

function bubble(text,who){
  const div=document.createElement("div");
  div.className="msg "+(who==="user"?"user":"ai");
  div.textContent=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
  return div;
}
function renderHistory(){
  chat.replaceChildren();
  if(!history.length){chat.appendChild(welcome);return;}
  history.forEach(m=>bubble(m.text,m.role==="user"?"user":"ai"));
}
function save(){
  try{localStorage.setItem("smile-history",JSON.stringify(history));}
  catch{}
}
renderHistory();

document.querySelectorAll("[data-p]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    input.value=btn.dataset.p;
    input.focus();
  });
});

document.querySelector("#clear").onclick=()=>{
  history=[];
  save();
  renderHistory();
};

input.addEventListener("input",()=>{
  input.style.height="auto";
  input.style.height=Math.min(input.scrollHeight,130)+"px";
});

form.addEventListener("submit",async e=>{
  e.preventDefault();
  const prompt=input.value.trim();
  if(!prompt||send.disabled)return;
  welcome.remove();
  history.push({role:"user",text:prompt});
  bubble(prompt,"user");
  save();
  input.value="";
  input.style.height="auto";
  send.disabled=true;
  const loading=bubble("Smile AI sedang berpikir...","ai");

  try{
    const response=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        message:prompt,
        history:history.slice(-21,-1)
      })
    });
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||"Permintaan gagal.");
    loading.textContent=data.reply;
    history.push({role:"model",text:data.reply});
    history=history.slice(-30);
    save();
  }catch(err){
    loading.textContent="Gagal menghubungi AI: "+err.message+
      "\nCoba periksa koneksi atau konfigurasi API.";
  }finally{
    send.disabled=false;
    input.focus();
    chat.scrollTop=chat.scrollHeight;
  }
});
</script>
</body>
</html>
